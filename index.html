<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayooMobileApp</title>
     <!-- daisy ui cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind css cdn --> 
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body  class="bg-[#f4f5f7] h-screen flex justify-center items-center  flex-col">
  <div class="h-[110px] w-[300px]  bg-[url(./assets/bg.png)] bg-cover flex justify-center items-center">
     <img class="w-20 h-20"" src="./assets/Group.png " alt="">
  </div>
  <form class="  bg-white rounded-2xl p-5 w-[350px] " action="">
    <div>
     <fieldset class="fieldset">
  <legend class="fieldset-legend">Mobile Number</legend>
  <input  classtype="text" id="mobileNumber" class="input bg-[#f4f5f7] rounded-3xl" placeholder="Enter Your Number" />
 
</fieldset>
    </div>
    <div>
     <fieldset class="fieldset">
  <legend class="fieldset-legend ">4-Digit Pin</legend>
  <input type="text" id="pinNumber" class="input bg-[#f4f5f7] rounded-3xl " placeholder="Enter 4-Digit Pin" />
   
</fieldset>
    </div>
    <button type="button" class="btn bg-[#0874f2] text-white mt-5 w-full rounded-3xl" id="login-btn"> Login</button>
  </form>
  <script src="script.js"></script>
   
</body>

</html>
