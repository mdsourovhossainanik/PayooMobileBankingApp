<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

 <!-- daisy ui cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind css cdn --> 
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-[#f4f5f7] h-screen">

    <nav class="bg-white max-w-lg mx-auto  min-h-[50px] flex justify-between items-center p-2 border-b-2 border-gray-300">
        
        <div class="flex gap-2 items-center">
            <img src="./assets/Group.png" alt="" class="h-[40px]">
            <div>
               <h2 class="text-xl font-bold">$<span id="available-balance">45500</span></h2>
               <p class="text-gray-500">Available Balance</p>
            </div>
        </div>

        <button id="logout-btn" class="  text-gray-500 btn">
    <i class="text-black rotate-180 fa-solid fa-arrow-right-from-bracket"></i>
    Logout
</button>
 </nav>

   

    <div class= " rounded-lg bg-white mt-5  max-w-lg mx-auto p-4 min-h-[100px] ">
        <h1 class="text-2xl font-bold">🔥Wellcome to Payoo!</h1>
        <p class="text-gray-600">Enjoy easy convenient financial services with <br> Cashout charge is law</us></p>
    </div>
     <!-- button session -->
   <div class=" rounded-lg bg-white grid grid-cols-3 gap-5 mt-7 max-w-lg mx-auto p-4 min-h-[300px]">
         <div id="add-money-btn" class =" hover:bg-blue-100 flex flex-col items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/money1.png" alt="" class="">
            <p>Add Money</p>
         </div>
          <div id="cash-out-btn" class ="hover:bg-blue-100 flex flex-col  items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/send1.png" alt="" class="">
            <p>Cash out</p>
         </div>
          <div id="money-transfer-btn" class ="hover:bg-blue-100 flex flex-col items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/transaction1.png" alt="" class="">
            <p>Transfer Money</p>
         </div>
          <div id="get-bonus-btn" class ="hover:bg-blue-100 flex flex-col items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/bonus1.png" alt="" class="">
            <p>Get Bonus</p>
         </div>
          <div id="pay-bill-btn" class ="hover:bg-blue-100 flex flex-col items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/purse1.png" alt="" class="">
            <p>Pay Bill</p>
         </div>
          <div id="wallet-btn" class ="hover:bg-blue-100 flex flex-col items-center gap-2 border border-gray-300 p-4 rounded-lg">
            <img src="./assets/wallet1.png" alt="" class="">
            <p>Wallet</p>
         </div>

    </div>
<!--  Add Money Section -->
<div id="add_money_section" class="max-w-lg mx-auto mt-6 ">

    <h1 class="text-2xl font-bold mb-4">Add Money</h1>

    <div class="p-5 bg-white rounded-2xl min-h-[300px]">

        <select class="w-full bg-[#f4f5f7] rounded-3xl select [&::picker(select)]:max-h-26">
            <option disabled selected>Select Bank</option>
            <option>Dutch Bangla</option>
            <option>IFIC Bank</option>
            <option>Exim Bank</option>
        </select>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Account Number</legend>
            <input type="text" id="accountNumber"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter Account Number (must be 11 digits)">
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Pin Number</legend>
            <input type="text" id="pinNumber"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter 4-Digit Pin">
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Add Balance</legend>
            <input type="text" id="addBalance"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter Amount">
        </fieldset>

        <button id="home-btn"
            type="button"
            class="btn bg-[#0874f2] text-white mt-5 w-full rounded-3xl">
            Login
        </button>

    </div>

</div>

<!-- Cash Out Section -->
  <div id="cash-out-section" class="max-w-lg mx-auto mt-6 " style="display: none;">

    <h1 class="text-2xl font-bold mb-4">Cash Out</h1>

    <div class="p-5 bg-white rounded-2xl min-h-[300px]">

        <select class="w-full bg-[#f4f5f7] rounded-3xl select [&::picker(select)]:max-h-26">
            <option disabled selected>Select Bank</option>
            <option>Dutch Bangla</option>
            <option>IFIC Bank</option>
            <option>Exim Bank</option>
        </select>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Account Number</legend>
            <input type="text" id="cash-account-number"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter Account Number (must be 11 digits)">
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Pin Number</legend>
            <input type="text" id="cash-pin-number"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter 4-Digit Pin">
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Amount</legend>
            <input type="text" id="cash-amount"
                class="w-full input bg-[#f4f5f7] rounded-3xl"
                placeholder="Enter Amount">
        </fieldset>

        <button id="withdraw-btn"
            type="button"
            class="btn bg-[#0874f2] text-white mt-5 w-full rounded-3xl">Withdraw</button>

    </div>

</div>

<script src="home.js"></script>
</body>
</html>
